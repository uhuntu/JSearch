name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build and test
        run: |
          cd modern
          javac -encoding UTF-8 -d out $(find src -name '*.java')
          java -Dfile.encoding=UTF-8 -cp out jsearch.Tests
