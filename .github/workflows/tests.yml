name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build and test
        run: |
          cd modern
          javac -encoding UTF-8 -d out $(find src -name '*.java')
          java -Dfile.encoding=UTF-8 -cp out jsearch.Tests

  # The archive's reason for existing is that original bytes survive. A file
  # saved as UTF-8 by an editor with the wrong setting is a converted file, and
  # this is the only job that can see it.
  encoding:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Verify the original files are still GBK
        run: |
          cd modern
          javac -encoding UTF-8 -d out $(find src -name '*.java')
          java -Dfile.encoding=UTF-8 -cp out jsearch.EncodingGuard

  # runner/ is the only path in the repository that executes the original 2002
  # artifact. Nothing else here loads Sources/JSApplet.class — `modern/` is a
  # rewrite, and EncodingGuard only reads the bytes — so this job is the only
  # thing that can notice the original stopping work: a JDK that finishes
  # removing java.applet, a re-encode of Sources/, a stray edit to the engine
  # file, or a JSearchRunner change that quietly stops selecting a live engine.
  # Until this job existed, the only evidence the applet still ran was a
  # screenshot and a paragraph of prose.
  runner:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 11, like the jobs above, so one JDK version covers the workflow.
      # java.applet is deprecated for removal here but still present; the
      # applet will stop compiling the day that changes, which is the point.
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # The applet's UI is Chinese. AWT would still run with no CJK face, but
      # would draw every label as a box, so install one and keep the run honest
      # about what it is exercising. Note this replaces the job of
      # fontconfig.properties, which run.sh deliberately does not pass on Linux.
      - name: Install a CJK font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      # The applet opens a window and nothing closes it, so the run is capped
      # and timeout's 124 is the expected outcome, not a failure: the applet
      # reports what it did on stdout and the next step is the gate. 90s is
      # generous — a run that finds nothing prints its own "no results" line at
      # 30s, so success and failure are both distinguishable well inside it.
      - name: Run the original applet headless
        run: |
          set +e
          xvfb-run -a --server-args="-screen 0 1024x768x24" \
            timeout 90 ./runner/run.sh --go 2>&1 | tee runner-ci.log
          echo "run.sh exited ${PIPESTATUS[0]} (124 = the cap was reached, as intended)"

      # Invoked through `sh` so the job does not depend on the file's exec bit.
      # The assertions are on ASCII the runner prints verbatim, so they do not
      # depend on the Chinese text decoding a particular way in this log.
      - name: Assert the applet actually ran and searched
        run: sh ./runner/verify.sh runner-ci.log
