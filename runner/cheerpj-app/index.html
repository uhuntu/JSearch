<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>JSearch 2.0.0.0 · 浏览器中的 2002 Applet</title>
<script src="cheerpj/4.3/loader.js"></script>
<style>
  body { margin:0; padding:16px; background:#3a6ea5; color:#fff;
         font:14px/1.6 Tahoma, Verdana, sans-serif; }
  h3 { margin:0 0 8px; }
  #status { background:#7fffff; color:#000; border:2px solid #0b2545;
            padding:8px 12px; max-width:720px; }
</style>
</head>
<body>
<h3>JSearch 2.0.0.0 — 运行在 2026 年的浏览器里</h3>
<div id="status">正在初始化 CheerpJ WebAssembly JVM（首次运行会自托管缓存全部运行时文件）…</div>
<p>下面是 2002 年的 Applet 本体 —— 未经一行改动的字节码，通过
<code>&lt;cheerpj-applet&gt;</code> 元素获得 AppletStub（参数即下方 param），
引擎表与搜索流量都走本页同端口的桥，全程离线自持。</p>

<!-- The 2002 embed page, modernized: same <param> lines JSearch.html fed the
     Java Plug-in, new tag name. currUrl is absolute - new URL(relative)
     throws MalformedURLException. -->
<cheerpj-applet code="JSApplet.class"
                codebase="http://127.0.0.1:8902/app/"
                width="790" height="450">
  <param name="currUrl" value="http://127.0.0.1:8902/app/">
  <param name="_readTxt" value="No">
  <param name="smcCh" value="4">
  <param name="smlCh" value="1">
  <param name="smsCh" value="10">
  <param name="valurlCh" value="No">
  <param name="languageCh" value="Chinese">
  <param name="webBrowCh" value="Other browsers">
  <param name="webBrowPTf" value="">
</cheerpj-applet>

<script type="module">
  const statusBox = document.getElementById("status");
  await cheerpjInit({ status: "cdn" });
  statusBox.textContent =
      "CheerpJ 运行时就绪 —— 2002 年的 Applet 应在下方渲染出来";

  // Rendering spy: cheerpOS replaces the <cheerpj-applet> element with real
  // DOM once the applet's UI exists - possibly inside a shadow root. Report
  // that to the bridge's log (a 404 is fine - the request line is the
  // evidence) so a headless run can prove the applet actually rendered
  // without a human looking at the screen.
  const appletEl = document.querySelector("cheerpj-applet");
  let reported = false;
  const hasRendered = () => {
    const roots = [document];
    if (appletEl && appletEl.shadowRoot) roots.push(appletEl.shadowRoot);
    for (const el of document.querySelectorAll("*")) {
      if (el.shadowRoot) roots.push(el.shadowRoot);
    }
    return roots.some((r) => r.querySelector("canvas, iframe"));
  };
  setInterval(() => {
    if (reported) return;
    if (hasRendered()) {
      reported = true;
      fetch("/app/__rendered__").catch(() => {});
    }
  }, 3000);
</script>
</body>
</html>
</html>
