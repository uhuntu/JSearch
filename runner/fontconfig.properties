# Composite-font mapping for the AWT heavyweight peers on Windows.
#
# The 2002 applet never sets fonts; every component renders in the logical
# default ("Dialog"), whose HFONT the Windows peers build from the composite
# font's alphabetic component alone. On a Chinese Windows 2000 box that
# component was a CJK font and everything drew; on a modern JDK the default
# alphabetic face has no CJK glyphs, and unlike edit controls (the preview
# pane — those font-link on their own), labels, lists, buttons and choices
# draw every Chinese string as boxes.
#
# Mapping the alphabetic component to a physical CJK-capable face restores
# the original look. If this machine lacks "Noto Sans SC", replace it with
# any installed CJK face ("Microsoft YaHei UI", "SimSun", ...).
# Passed to the JVM by run.sh via -Dsun.awt.fontconfig.

version=1
sequence.allfonts=alphabetic/default,dingbats,symbol

dialog.plain.alphabetic=Noto Sans SC
dialog.bold.alphabetic=Noto Sans SC
dialog.italic.alphabetic=Noto Sans SC
dialog.bolditalic.alphabetic=Noto Sans SC

dialoginput.plain.alphabetic=Noto Sans SC
dialoginput.bold.alphabetic=Noto Sans SC
dialoginput.italic.alphabetic=Noto Sans SC
dialoginput.bolditalic.alphabetic=Noto Sans SC

sansserif.plain.alphabetic=Noto Sans SC
sansserif.bold.alphabetic=Noto Sans SC
sansserif.italic.alphabetic=Noto Sans SC
sansserif.bolditalic.alphabetic=Noto Sans SC

serif.plain.alphabetic=Noto Sans SC
serif.bold.alphabetic=Noto Sans SC
serif.italic.alphabetic=Noto Sans SC
serif.bolditalic.alphabetic=Noto Sans SC

monospaced.plain.alphabetic=Noto Sans SC
monospaced.bold.alphabetic=Noto Sans SC
monospaced.italic.alphabetic=Noto Sans SC
monospaced.bolditalic.alphabetic=Noto Sans SC
